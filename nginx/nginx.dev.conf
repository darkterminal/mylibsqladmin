# Proxy template for mylibsqladmin.
#
# Placeholders are rendered by /usr/local/bin/proxy-entrypoint.sh at container
# start. Keep this file free of environment-specific hostnames:
#   __LIBSQL_PARENT_DOMAIN__   client-facing parent domain, e.g. example.com
#   __VALIDATOR_UPSTREAM__     webapp validator, e.g. mylibsqladmin-webui-prod:8000
#   __DB_HTTP_UPSTREAM__       sqld HRANA,  e.g. db:8080
#   __DB_GRPC_UPSTREAM__       sqld gRPC,   e.g. db:5001
#
# TLS is terminated in front of this listener. The edge MUST forward the
# original Host header, because <database>.<parent> is the routing key.

lua_package_path "/etc/nginx/lua/?.lua;;";

map $http_authorization $grpc_auth {
    default "Bearer $http_authorization";
}

# Admin HTTP API (sqld at :8081) is intentionally NOT exposed through either
# listener. The webapp reaches it via the internal Docker network (db:8081).
# Do not re-add a public listener here.

server {
    listen 8080;
    http2 on;
    server_name _;

    resolver 127.0.0.11 valid=30s;
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_body_in_single_buffer on;

    # The subdomain comes from subdomain.from_request(), the single canonical
    # source shared with the validator. That keeps routing and authorization
    # on the same value even for absolute-form request lines.
    set_by_lua_block $subdomain {
        return require("subdomain").from_request("__LIBSQL_PARENT_DOMAIN__")
    }

    auth_request /validate-subdomain;
    auth_request_set $access_level $upstream_http_x_access_level;

    error_page 400 401 402 403 405 500 501 502 503 504 = @blank_response;
    proxy_intercept_errors on;

    location @blank_response {
        header_filter_by_lua_block {
            ngx.header.content_type = nil
            ngx.header.content_length = nil
            ngx.header.server = nil
            for k in pairs(ngx.header) do
                if k:lower() ~= "content-security-policy" then
                    ngx.header[k] = nil
                end
            end
        }

        # A bare 204 keeps the Turso CLI happy: it cannot render an HTML 403.
        return 204;
    }

    # gRPC paths proxy straight to sqld, which performs no JWT verification
    # by itself. Authorization must happen HERE: only fully-authorized
    # (full-access) tokens may use these endpoints — statement-level
    # filtering of protobuf bodies is not feasible at the proxy layer.
    location ~ ^/wal_log\.ReplicationLog/ {
        auth_request /validate-subdomain;
        auth_request_set $access_level $upstream_http_x_access_level;
        access_by_lua_block {
            if ngx.var.subdomain == nil or ngx.var.subdomain == "" then
                ngx.exit(403)
            end
            if ngx.var.access_level ~= "full-access" then
                ngx.exit(403)
            end
        }
        grpc_pass grpc://__DB_HTTP_UPSTREAM__;

        grpc_set_header Content-Type application/grpc;
        grpc_set_header TE trailers;
        grpc_set_header Turso-Database $subdomain;
        grpc_set_header X-Proxy-Authorization $grpc_auth;
        grpc_set_header Host $host;
    }

    location ~ ^/proxy\.Proxy/ {
        auth_request /validate-subdomain;
        auth_request_set $access_level $upstream_http_x_access_level;
        access_by_lua_block {
            if ngx.var.subdomain == nil or ngx.var.subdomain == "" then
                ngx.exit(403)
            end
            if ngx.var.access_level ~= "full-access" then
                ngx.exit(403)
            end
        }
        grpc_pass grpc://__DB_HTTP_UPSTREAM__;

        grpc_set_header Content-Type application/grpc;
        grpc_set_header TE trailers;
        grpc_set_header Turso-Database $subdomain;
        grpc_set_header X-Proxy-Authorization $grpc_auth;
        grpc_set_header Host $host;
    }

    # CORS for browser clients (e.g. Database Studio's parent page).
    # Preflight (OPTIONS) answers without a token — browsers never send
    # one there. Everything else is handed to the internal location,
    # which applies the normal token-validation flow.
    location = /v2/pipeline {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'authorization, content-type, x-proxy-authorization, x-turso-database' always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        rewrite ^ /internal-auth-pipeline last;
    }

    location = /internal-auth-pipeline {
        internal;
        auth_request /validate-subdomain;
        auth_request_set $access_level $upstream_http_x_access_level;

        # F-54: auth_request alone is not enough — the validator answers 200
        # with X-Access-Level: none for an absent/unknown token. The shared
        # gate rejects that and applies read-only SQL filtering exactly as
        # `location /` does.
        access_by_lua_file /etc/nginx/lua/authorize.lua;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Turso-Database $subdomain;
        proxy_set_header Host $host;
        proxy_pass http://__DB_HTTP_UPSTREAM__/v2/pipeline;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'authorization, content-type, x-proxy-authorization, x-turso-database' always;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_intercept_errors on;

        access_by_lua_file /etc/nginx/lua/authorize.lua;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Turso-Database $subdomain;
        proxy_pass http://__DB_HTTP_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @blank_response {
        header_filter_by_lua_block {
            if ngx.var.http_content_type == "application/grpc" then
                ngx.header.content_type = "application/grpc"
                ngx.status = 13
            else
                ngx.header.content_type = nil
            end
            ngx.header.server = nil
        }
        return 204;
    }

    location = /validate-subdomain {
        internal;

        # No user-agent shortcuts: every request must be validated by the
        # webapp validator. Trusting browser UAs here makes the whole
        # token system decorative.

        # Recompute in the subrequest with the same canonical helper used for
        # routing: do not rely on a parent request's variable surviving the
        # auth_request hop, and never derive this from a different Host source.
        set_by_lua_block $validator_subdomain {
            return require("subdomain").from_request("__LIBSQL_PARENT_DOMAIN__")
        }

        proxy_pass http://__VALIDATOR_UPSTREAM__/validate-subdomain;
        proxy_set_header X-Subdomain $validator_subdomain;
        proxy_set_header X-Auth-Token $arg_authToken$arg_auth_token$arg_jwt$http_authorization;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
}

# Native gRPC listener. The compose file maps :5001; without this server that
# port was dead. Same authorization rules as the gRPC locations above, but it
# talks to sqld's dedicated gRPC port.
server {
    listen 5001;
    http2 on;
    server_name _;

    resolver 127.0.0.11 valid=30s;

    set_by_lua_block $subdomain_grpc {
        return require("subdomain").from_request("__LIBSQL_PARENT_DOMAIN__")
    }

    location ~ ^/wal_log\.ReplicationLog/ {
        auth_request /validate-subdomain-grpc;
        auth_request_set $access_level $upstream_http_x_access_level;
        access_by_lua_block {
            if ngx.var.subdomain_grpc == nil or ngx.var.subdomain_grpc == "" then
                ngx.exit(403)
            end
            if ngx.var.access_level ~= "full-access" then
                ngx.exit(403)
            end
        }
        grpc_pass grpc://__DB_GRPC_UPSTREAM__;
        grpc_set_header Content-Type application/grpc;
        grpc_set_header TE trailers;
        grpc_set_header Turso-Database $subdomain_grpc;
        grpc_set_header X-Proxy-Authorization $grpc_auth;
        grpc_set_header Host $host;
    }

    location ~ ^/proxy\.Proxy/ {
        auth_request /validate-subdomain-grpc;
        auth_request_set $access_level $upstream_http_x_access_level;
        access_by_lua_block {
            if ngx.var.subdomain_grpc == nil or ngx.var.subdomain_grpc == "" then
                ngx.exit(403)
            end
            if ngx.var.access_level ~= "full-access" then
                ngx.exit(403)
            end
        }
        grpc_pass grpc://__DB_GRPC_UPSTREAM__;
        grpc_set_header Content-Type application/grpc;
        grpc_set_header TE trailers;
        grpc_set_header Turso-Database $subdomain_grpc;
        grpc_set_header X-Proxy-Authorization $grpc_auth;
        grpc_set_header Host $host;
    }

    location = /validate-subdomain-grpc {
        internal;
        set_by_lua_block $validator_subdomain_grpc {
            return require("subdomain").from_request("__LIBSQL_PARENT_DOMAIN__")
        }
        proxy_pass http://__VALIDATOR_UPSTREAM__/validate-subdomain;
        proxy_set_header X-Subdomain $validator_subdomain_grpc;
        proxy_set_header X-Auth-Token $arg_authToken$arg_auth_token$arg_jwt$http_authorization;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location / {
        return 404;
    }
}
