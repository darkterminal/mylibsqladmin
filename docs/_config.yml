title: MylibSQLAdmin
tagline: Modern libSQL database management
description: >-
  MylibSQLAdmin is an open-source platform for managing libSQL databases
  through a web GUI and the libsql3 CLI. This site is the product landing
  page and the complete user manual, including the CLI reference.
url: https://darkterminal.github.io
baseurl: /mylibsqladmin

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: pretty

# The root installation guide stays on GitHub; the manual and the generated
# CLI reference are both published as part of this site.
exclude:
  - README.md
  - cli-smoke-test.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache
  - _site

defaults:
  - scope:
      path: "user-manual"
    values:
      layout: manual
