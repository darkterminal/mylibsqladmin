services:
  web:
    container_name: mylibsqladmin-web
    build:
      context: ./webapp
      dockerfile: Dockerfile.local
      args:
        APP_ENV: development
        ENV_FILE: .env.local # Use the development env file
    ports:
      - '8000:8000' # Laravel
      - '9003:9003' # Xdebug
      - '5173:5173' # Vite
    volumes:
      - ./webapp:/var/www/html
      - ./webapp/storage:/var/www/html/storage
    network_mode: host
    profiles: ['development']

  web_prod:
    container_name: mylibsqladmin-web
    build:
      context: ./webapp
      dockerfile: Dockerfile.production
      args:
        APP_ENV: production
        ENV_FILE: .env.production # Use the production env file
    ports:
      - '8000:8000'
    environment:
      APP_KEY: ${APP_KEY:-} # entrypoint.sh fails fast with a clear message if invalid
      APP_URL: ${APP_URL:-http://localhost:8000}
      # Declarative source support — bootstrap/app.php reads this via config.
      TRUST_PRIVATE_PROXIES: ${TRUST_PRIVATE_PROXIES:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # F-60 fallback: use Laravel's HTTP server instead of Octane/FrankenPHP.
      # Set WEB_SERVER=octane only after the FrankenPHP/Octane mismatch is fixed.
      WEB_SERVER: ${WEB_SERVER:-artisan}
    network_mode: host
    restart: always
    profiles: ['production']

  proxy:
    container_name: mylibsqladmin-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
      - '5001:5001'
    environment:
      LIBSQL_PARENT_DOMAIN: ${LIBSQL_PARENT_DOMAIN:-localhost}
      LIBSQL_VALIDATOR_UPSTREAM: ${LIBSQL_VALIDATOR_UPSTREAM:-mylibsqladmin-webui-dev:8000}
      LIBSQL_DB_HTTP_UPSTREAM: ${LIBSQL_DB_HTTP_UPSTREAM:-db:8080}
      LIBSQL_DB_GRPC_UPSTREAM: ${LIBSQL_DB_GRPC_UPSTREAM:-db:5001}
    volumes:
      - ${NGINX_CONF:-./nginx/nginx.dev.conf}:/etc/nginx/templates/default.conf.template:ro
    networks:
      - app-network
    restart: always
    depends_on:
      db:
        condition: service_started
    profiles: ['local-instance']

  db:
    container_name: mylibsqladmin-db
    image: ghcr.io/tursodatabase/libsql-server:latest
    platform: linux/amd64
    # No entrypoint/user override: the image wrapper chowns SQLD_DB_PATH and
    # drops to the sqld user (UID/GID 666). Overriding either caused the
    # "Permission denied (os error 13)" from F-60.
    environment:
      SQLD_DB_PATH: /var/lib/sqld
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
      SQLD_GRPC_LISTEN_ADDR: 0.0.0.0:5001
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:8081
    # First arg MUST be /bin/sqld: docker-entrypoint.sh only appends
    # --db-path when $1 is /bin/sqld. These two flags have no env equivalent.
    command:
      - /bin/sqld
      - --enable-namespaces
      - --no-welcome
    volumes:
      - ./libsql-data:/var/lib/sqld
    restart: always
    networks:
      - app-network
    profiles: ['local-instance']

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - app-network
    profiles: ['development']

